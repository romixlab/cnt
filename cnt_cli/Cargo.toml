[package]
name = "cnt_cli"
description = "Command line interface for the embedded counters crate - cnt"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "cnt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
cnt_core = { path = "../cnt_core" }
probe-rs = "0.31.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
human-repr = "1.1.0"