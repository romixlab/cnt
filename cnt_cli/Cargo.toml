[package]
name = "cnt_cli"
description = "Command line interface for the embedded counters crate - cnt"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "cnt"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
cnt_core.workspace = true
crossterm = "0.29.0"
human-repr = "1.1.0"
probe-rs = "0.32.0"
ratatui = "0.30.2"
# Conversion from `anstyle` styles, so that the TUI shares the CLI theme
ratatui-core = { version = "0.1.2", features = ["anstyle"] }
serde_json = "1.0.151"
toml = "1.1.6"
