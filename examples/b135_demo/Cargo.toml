[package]
name = "b135_demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Demo firmware for the B135 board: a simulated instrument whose counters cnt tui shows"

# Not part of the cnt workspace: built for a Cortex-M target only
[workspace]

[dependencies]
cnt = { path = "../../cnt" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h725ig", "time-driver-any", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

[profile.release]
codegen-units = 1
debug = 2 # debug info does not end up in flash
lto = "fat"
opt-level = "z"

[profile.release.build-override]
opt-level = 0
