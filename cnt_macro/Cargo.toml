[package]
name = "cnt_macro"
description = "Macro for the embedded counters crate - cnt"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
cnt = { path = "../cnt" }
